<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="calculator">
        <div class="display">
    <h2 id="display"></h2>

        </div>
        <div class="button">
            <button class="btn action">AC</button>
            <button class="btn action">Back</button>
            <button class="btn operator"onclick="showDigit(%)">%</button>
            <button class="btn operator"onclick="showDigit(/)">/</button>

            <button class="btn" onclick="showDigit(7)">7</button  >
            <button class="btn"onclick="showDigit(8)">8</button>
            <button class="btn"onclick="showDigit(9)">9</button>
            <button class="btn operator" onclick="showDigit()">*</button>

            <button class="btn"onclick="showDigit(4)">4</button>
    <button class="btn" onclick="showDigit(5)">5</button>
            <button class="btn"onclick="showDigit(6)">6</button>
            <button class="btn operator"onclick="showDigit(5)">-</button>

            <button class="btn" onclick="showDigit(1)">1</button>
            <button class="btn" onclick="showDigit(2)">2</button>
            <button class="btn" onclick="showDigit(3)">3</button>
            <button class="btn operator" onclick="showDigit(5)">+</button>


            <button class="btn" onclick="showDigit(0)">0</button>
            <button class="btn"onclick="showDigit(00)">00</button>
            <button class="btn"onclick="showDigit(.)">.</button>
            <button class="btn operator "onclick="showDigit(5)">=</button>







        </div>
    </div>
<script src="script.js"></script>
</body>

</html>
